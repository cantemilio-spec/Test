<style>
/* Layout: terminal em tela cheia. Barra de status no topo, histórico rolável no meio, atalhos e linha de comando presos embaixo. */
:root {
  --bg: #14110d;
  --fg: #e6dac2;
  --dim: #8c7f6a;
  --accent: #ffb000;
  --line: #2d271e;
  --ok: #9bd48f;
  --err: #ff8470;
  --sel: rgba(255, 176, 0, 0.25);
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --display: 'Uncial Antiqua', 'Cinzel', Georgia, 'Times New Roman', serif;
  --fs: 14px;
  --rune: #e3a63c;
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  box-sizing: border-box;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  color: var(--fg);
  font: var(--fs, 14px)/var(--lh, 1.5) var(--mono);
}
::selection { background: var(--sel); }
.term {
  height: 100%;
  max-width: var(--maxw, 880px);
  margin-inline: auto;
  display: flex;
  flex-direction: column;
}

.bar {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  padding-block: 0.75rem 0.6rem;
  border-bottom: 1px solid var(--line);
  font-size: 0.75em;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--dim);
}
.blk { color: var(--accent); margin-right: 0.6ch; }
.clock { font-variant-numeric: tabular-nums; color: var(--fg); }

.outwrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.down {
  position: absolute;
  right: 0.4rem;
  bottom: 0.6rem;
  font: inherit;
  line-height: 1;
  color: var(--accent);
  background: var(--bg);
  border: 1px solid var(--accent);
  padding: 0.3rem 1ch;
  cursor: pointer;
}
.out {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding-block: 1rem 0.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
  overscroll-behavior: contain;
}
.ln { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.dim, .res { color: var(--dim); }
.ok { color: var(--ok); }
.err { color: var(--err); }
.gap { height: 0.5rem; flex: none; }
.brand {
  font-family: var(--display);
  font-size: clamp(2.4rem, 9vw, 3.2rem);
  line-height: 0.9;
  letter-spacing: 0.02em;
  color: var(--accent);
}
.echo .p { color: var(--accent); margin-right: 1ch; }
.raw {
  border-left: 2px solid var(--line);
  padding-left: 1.5ch;
  user-select: text;
}

.th {
  display: grid;
  grid-template-columns: 6ch minmax(0, 1fr);
  column-gap: 1ch;
  padding-block: 0.4rem;
  border-top: 1px dashed var(--line);
}
.th .id { grid-row: 1 / 3; color: var(--accent); cursor: pointer; }
.th .when { color: var(--dim); font-size: 0.8em; }
.th .body { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.tag {
  font: inherit;
  color: var(--accent);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-decoration: underline dotted;
  text-underline-offset: 3px;
}
.tagcloud { display: flex; flex-wrap: wrap; gap: 0.25rem 2ch; }

.grid {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 0.2rem 2ch;
  margin-block: 0.2rem;
}
.grid .k { color: var(--accent); }
.grid.stat .k { color: var(--dim); }
.grid .v { min-width: 0; overflow-wrap: anywhere; }
.grid.help .v { color: var(--dim); }

.chips, .sugs {
  display: flex;
  gap: 0.5rem;
  overflow-x: auto;
  padding-block: 0.5rem;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar, .sugs::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  font: inherit;
  font-size: 0.8em;
  color: var(--dim);
  background: transparent;
  border: 1px solid var(--line);
  padding: 0.2rem 1.2ch;
  cursor: pointer;
}
.down:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip:hover, .chip[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.chip:focus-visible, .send:focus-visible, .tag:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.line {
  display: flex;
  align-items: flex-start;
  gap: 1ch;
  padding-block: 0.6rem;
  border-top: 1px solid var(--line);
}
.line:focus-within { border-top-color: var(--accent); }
.prompt { color: var(--accent); white-space: nowrap; }
#in {
  flex: 1;
  min-width: 0;
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border: 0;
  outline: none;
  resize: none;
  background: transparent;
  color: var(--fg);
  caret-color: var(--accent);
  font: inherit;
  font-size: max(16px, 1em);
  max-height: 10rem;
}
#in:disabled { opacity: 0.4; }
.send {
  flex: none;
  align-self: flex-end;
  font: inherit;
  line-height: 1.2;
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--line);
  padding: 0.1rem 1.2ch;
  cursor: pointer;
}
.send:hover { border-color: var(--accent); }

/* v1.12 · visual renovado (mesmo terminal, mais organizado) */
.echo { background: color-mix(in srgb, var(--accent) 7%, transparent); border-left: 2px solid var(--accent); padding: 0.1rem 1ch; margin-top: 0.35rem; }
.th { border-top: 0; border-left: 2px solid var(--line); padding: 0.35rem 0 0.35rem 1.2ch; margin-block: 0.1rem; }
.th:hover { border-left-color: var(--accent); }
.dayhd { display: flex; align-items: center; gap: 1ch; margin-top: 0.5rem; color: var(--dim); font-size: 0.75em; letter-spacing: 0.12em; text-transform: uppercase; }
.dayhd::after { content: ''; flex: 1; border-top: 1px solid var(--line); }
.chip { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.line { border: 1px solid var(--line); padding: 0.55rem 1.2ch; margin-block: 0.4rem 0.6rem; }
.line:focus-within { border-color: var(--accent); }
.send { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
.send:hover { filter: brightness(1.1); }
.bar > * { white-space: nowrap; }
.keys { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hstat { display: none; font-variant-numeric: tabular-nums; color: var(--dim); }
@media (min-width: 600px) { .hstat { display: inline; margin-inline: auto 1rem; } }

/* v1.13 · painel de configurações com seções e ícones */
.ico { display: inline-flex; width: 1.15em; height: 1.15em; flex: none; }
.ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: square; stroke-linejoin: miter; }
.cfg.cp { gap: 0.7rem; }
.cphead { display: flex; align-items: center; gap: 1ch; color: var(--accent); font-size: 0.8em; letter-spacing: 0.14em; text-transform: uppercase; }
.cfg details.sec { border: 1px solid var(--line); }
.cfg details.sec > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 1ch; padding: 0.55rem 1.2ch; color: var(--accent); font-size: 0.78em; letter-spacing: 0.12em; text-transform: uppercase; background: color-mix(in srgb, var(--accent) 5%, transparent); }
.cfg details.sec > summary::-webkit-details-marker { display: none; }
.cfg details.sec > summary::after { content: '▾'; margin-left: auto; color: var(--dim); }
.cfg details.sec:not([open]) > summary::after { content: '▸'; }
.cfg details.sec > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cfg .secbody { display: grid; gap: 0.95rem; padding: 0.85rem 1.2ch; }
.cfg.cp .row { grid-template-columns: minmax(13ch, 16ch) minmax(0, 1fr); }
.cfg .lab { display: flex; align-items: center; gap: 0.8ch; }
.cfg .opt[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
.cfg .opt .dot { border-color: currentColor; }
.cfg .opt svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; }
.cfg .acts { display: flex; flex-wrap: wrap; gap: 0.5rem; }
@media (max-width: 480px) { .cfg.cp .row { grid-template-columns: 1fr; } }

/* v1.14 · animações (desligáveis em /config → animações) */
@keyframes emrys-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
@keyframes emrys-focus { from { opacity: 0; filter: blur(9px); transform: scale(1.03); } to { opacity: 1; filter: blur(0); transform: none; } }
@keyframes emrys-brand { from { opacity: 0; letter-spacing: 0.4em; } to { opacity: 1; letter-spacing: 0.02em; } }
@keyframes emrys-flash { from { background-color: color-mix(in srgb, var(--accent) 16%, transparent); } to { background-color: transparent; } }
@keyframes emrys-shake { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
.art { text-shadow: 0 0 6px color-mix(in srgb, var(--accent) 30%, transparent); animation: emrys-focus 1.4s ease-out both; }
.brand { animation: emrys-brand 1s ease-out 0.35s both; }
.fx { animation: emrys-in 0.24s ease-out both; }
.th.fx { animation: emrys-in 0.24s ease-out both, emrys-flash 1.4s ease-out backwards; }
.cfg details[open] > .secbody { animation: emrys-in 0.22s ease-out both; }
.term:not([hidden]) { animation: emrys-in 0.45s ease-out both; }
.gate > * { animation: emrys-in 0.5s ease-out both; }
.gate > *:nth-child(2) { animation-delay: 0.08s; }
.gate > *:nth-child(3) { animation-delay: 0.16s; }
.gate > *:nth-child(4) { animation-delay: 0.24s; }
.gate > *:nth-child(5) { animation-delay: 0.32s; }
.gate > *:nth-child(n+6) { animation-delay: 0.4s; }
.gate .msg.shake { animation: emrys-shake 0.38s ease-in-out; }
.chip, .send, .opt, .down { transition: transform 0.08s, background-color 0.15s, color 0.15s, border-color 0.15s; }
.chip:active, .send:active, .opt:active, .down:active { transform: scale(0.95); }
.noanim *, .noanim *::before, .noanim *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

.wmimg { display: block; width: min(200px, 56vw); aspect-ratio: 640 / 205; margin-inline: auto; background: var(--accent); -webkit-mask: var(--wmimg) center / contain no-repeat; mask: var(--wmimg) center / contain no-repeat; filter: drop-shadow(0 0 14px color-mix(in srgb, var(--accent) 28%, transparent)); }
.brand .wmimg { width: min(170px, 50vw); margin-inline: 0; }
.brand { line-height: 0; margin-block: 0.4rem 0.1rem; }

.cfg {
  display: grid;
  gap: 0.9rem;
  margin-block: 0.25rem;
  padding: 0.8rem 1.5ch;
  border: 1px solid var(--line);
}
.cfg .row {
  display: grid;
  grid-template-columns: 12ch minmax(0, 1fr);
  gap: 0.4rem 2ch;
  align-items: center;
}
.cfg .lab { color: var(--dim); }
.cfg .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; min-width: 0; }
.cfg .opt {
  font: inherit;
  font-size: 0.85em;
  display: inline-flex;
  align-items: center;
  gap: 0.8ch;
  color: var(--fg);
  background: transparent;
  border: 1px solid var(--line);
  padding: 0.1rem 1ch;
  cursor: pointer;
}
.cfg .opt:hover { border-color: var(--accent); }
.cfg .opt[aria-pressed="true"] { border-color: var(--accent); }
.cfg .opt:focus-visible, .cfg input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cfg .dot { width: 0.9em; height: 0.9em; border: 1px solid var(--line); display: inline-block; }
.cfg input[type="color"] {
  width: 2.6rem;
  height: 1.8rem;
  padding: 0;
  border: 1px solid var(--line);
  background: transparent;
  cursor: pointer;
}
.cfg input[type="range"] { flex: 1; min-width: 8rem; accent-color: var(--accent); }
.cfg .val { font-variant-numeric: tabular-nums; min-width: 5ch; }
.cfg .sample { color: var(--fg); margin: 0; }
@media (max-width: 480px) {
  .cfg .row { grid-template-columns: 1fr; }
}

.mark.sm { display: inline-block; width: 1.5em; height: 1.5em; vertical-align: -0.35em; margin-right: 0.8ch; }
.mark.md { width: clamp(88px, 22vw, 128px); aspect-ratio: 1; margin-block: 0.25rem 0.5rem; }
.art {
  margin: 0;
  box-sizing: border-box;
  width: fit-content;
  max-width: 100%;
  font-family: 'DejaVu Sans Mono', 'Apple Braille', 'Segoe UI Symbol', 'Noto Sans Symbols 2', 'Menlo', var(--mono), monospace;
  font-size: min(7px, calc((100vw - 32px) / 34));
  line-height: 1;
  white-space: pre;
  color: var(--accent);
  user-select: text;
  overflow: hidden;
}

.gate {
  box-sizing: border-box;
  height: 100%;
  max-width: 360px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1rem;
  padding-block: 1.5rem;
}
.gate .brand { margin: 0; }
.gate .sub { margin: 0; color: var(--dim); }
.gate .fld { display: flex; align-items: baseline; gap: 1ch; border-bottom: 1px solid var(--line); padding-block: 0.4rem; }
.gate .fld:focus-within { border-bottom-color: var(--accent); }
.gate .fld label { color: var(--accent); white-space: nowrap; }
.gate .fld input {
  flex: 1;
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--fg);
  caret-color: var(--accent);
  font: inherit;
  font-size: max(16px, 1em);
}
.gate .keep { display: flex; align-items: center; gap: 1ch; color: var(--dim); font-size: 0.85em; }
.gate .keep input { accent-color: var(--accent); margin: 0; }
.gate .go {
  align-self: flex-start;
  font: inherit;
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--accent);
  padding: 0.25rem 2ch;
  cursor: pointer;
}
.gate .go:disabled { opacity: 0.4; cursor: default; }
.gate .go:focus-visible, .gate .keep input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gate .msg { margin: 0; min-height: 1.5em; color: var(--err); }
.gate .lnk {
  align-self: flex-start;
  font: inherit;
  font-size: 0.85em;
  color: var(--dim);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-decoration: underline dotted;
  text-underline-offset: 3px;
}
.gate .lnk:hover { color: var(--accent); }
.gate .lnk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.keys { display: none; }
.out > .art { flex: none; }
@media (min-width: 900px) and (hover: hover) {
  .art, .gate .hero .art { transform-origin: 50% 0; font-size: 8px; }
  .term { max-width: var(--maxw, 1080px); }
  .bar { padding-block: 1rem 0.8rem; }
  .keys { display: inline; margin-inline: auto 2rem; opacity: .7; letter-spacing: .04em; text-transform: none; }
  .out { padding-block: 1.25rem 0.75rem; padding-inline: 0.25rem; gap: .35rem; }
  .th { border-radius: 0 3px 3px 0; transition: background .12s; }
  .th:hover { background: rgba(255,176,0,.06); }
  .chip { cursor: pointer; transition: border-color .12s, color .12s; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .out::-webkit-scrollbar { width: 8px; }
  .out::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  .out::-webkit-scrollbar-thumb:hover { background: var(--dim); }
}

/* ---- login: visual emrys ---- */
.wm {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(3rem, 15vw, 4.4rem);
  line-height: 1;
  letter-spacing: 0.1em;
  text-align: center;
  color: var(--fg);
  text-shadow: 0 0 26px rgba(227, 166, 60, 0.3);
}
.wm.sm { font-size: clamp(2rem, 10vw, 2.8rem); text-align: left; }
.wm .cur {
  display: inline-block;
  width: 0.42em;
  height: 0.07em;
  margin-left: 0.14em;
  background: var(--rune);
  animation: emrys-blink 1.1s steps(1) infinite;
}
@keyframes emrys-blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .wm .cur { animation: none; } }
.gate { max-width: 420px; gap: 0.8rem; }
.gate .hero { display: flex; flex-direction: column; align-items: center; margin-bottom: 0.2rem; }
.gate .hero .art { transform-origin: 50% 0; font-size: min(7px, calc((100vw - 32px) / 34)); }
.gate .hero .wm { margin-top: 1rem; position: relative; }
.gate .sub {
  text-align: center;
  font-size: 0.72em;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-bottom: 0.4rem;
}
.gate .fld {
  align-items: center;
  gap: 1.4ch;
  min-height: 2.9rem;
  padding: 0.3rem 1.4ch;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--fg) 4%, var(--bg));
}
.gate .fld:focus-within { border-color: var(--rune); }
.gate .fld label {
  min-width: 6ch;
  font-size: 0.75em;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dim);
}
.gate .keep { justify-content: center; }
.gate .go {
  align-self: stretch;
  min-height: 2.9rem;
  text-align: center;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--rune);
  border-color: var(--rune);
}
.gate .go:hover:not(:disabled) { background: var(--rune); color: var(--bg); }
.gate .lnk { align-self: center; }
.gate .msg { text-align: center; }
.gate { justify-content: flex-start; }
.gate > :first-child { margin-top: auto; }
.gate > :last-child { margin-bottom: auto; }

.cfg textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 6rem;
  max-height: 14rem;
  resize: vertical;
  margin: 0;
  padding: 0.5rem 1ch;
  color: var(--fg);
  background: transparent;
  border: 1px solid var(--line);
  font: inherit;
  font-size: max(16px, 1em);
  line-height: 1.4;
}
.cfg textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cfg input[type="file"] { font: inherit; font-size: 0.85em; color: var(--fg); max-width: 100%; }
.cfg .note { margin: 0; color: var(--dim); font-size: 0.85em; }
.cfg .stack { display: grid; gap: 0.6rem; min-width: 0; }

/* ---------- Google Drive (v1.20) ---------- */
.drv { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: #050403; color: var(--fg); font-family: var(--mono); font-size: 14px; line-height: 1.4;
  padding: env(safe-area-inset-top, 0) max(14px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0) max(14px, env(safe-area-inset-left, 0px)); animation: emrys-in 0.28s ease-out both; overscroll-behavior: contain; }
.drv > * { width: 100%; max-width: 820px; margin-inline: auto; }
.drv button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.drv input { font: inherit; font-size: 16px; color: var(--fg); }
.drv-top { display: flex; align-items: center; gap: 10px; padding: 10px 0 4px; flex: none; }
.drv-title { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--display); font-size: 1.55rem; letter-spacing: 0.06em; color: var(--accent); text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 35%, transparent); }
.drv-title .drv-ico { width: 20px; height: 20px; }
.drv-ico { display: inline-flex; width: 22px; height: 22px; flex: none; color: var(--accent); }
.drv-ico svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: square; stroke-linejoin: miter; }
.drv-ib { width: 42px; height: 42px; display: inline-grid; place-items: center; border: 1px solid var(--line) !important; flex: none; }
.drv-ib:active, .drv-ib:hover { border-color: var(--accent) !important; }
.drv-orn { text-align: center; color: var(--accent); font-size: 0.7rem; line-height: 1; height: 14px; flex: none; position: relative; opacity: 0.85; }
.drv-orn::before, .drv-orn::after { content: ''; position: absolute; top: 50%; width: calc(50% - 16px); height: 1px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 60%, transparent)); }
.drv-orn::before { left: 0; } .drv-orn::after { right: 0; transform: scaleX(-1); }
.drv-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 0 14px; }
.drv-search { display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid var(--line); background: #0b0906; }
.drv-search:focus-within { border-color: var(--accent); }
.drv-search input { flex: 1; min-width: 0; height: 44px; background: none; border: 0; outline: 0; }
.drv-search input::placeholder { color: var(--dim); }
.drv-tabs { display: flex; gap: 6px; margin: 10px 0 0; overflow-x: auto; scrollbar-width: none; }
.drv-tab { padding: 8px 12px; border: 1px solid var(--line) !important; color: var(--dim) !important; white-space: nowrap; font-size: 0.85rem; }
.drv-tab.on { color: var(--accent) !important; border-color: var(--accent) !important; background: color-mix(in srgb, var(--accent) 8%, transparent) !important; }

<script>
(function () {
  'use strict';
  var KEY = 'pensamentos.v2';
  var VERSION = '1.23.0', BUILD = '2026-11-07';
  var $ = function (id) { return document.getElementById(id); };
  var out = $('out'), f = $('f'), inp = $('in'), modeEl = $('mode'), clock = $('clock');
  var MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

  var items = [], mode = 'local', coll = null;
  var hist = [], hi = 0, lastDeleted = null, wipe = false, warned = false;

  function p2(n) { return String(n).padStart(2, '0'); }
  function norm(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function sortItems() { items.sort(function (a, b) { return (a.ts - b.ts) || ((a.n || 0) - (b.n || 0)); }); }

  function tick() { var d = new Date(); clock.textContent = p2(d.getHours()) + ':' + p2(d.getMinutes()); }
  tick(); setInterval(tick, 15000);
  var taps = [];
  clock.addEventListener('click', function () {
    var now = Date.now();
    taps = taps.filter(function (t) { return now - t < 2500; });
    taps.push(now);
    if (taps.length >= 5) { taps = []; if (!inp.disabled) run('/versao'); }
  });

  function fmt(ts) {
    var d = new Date(ts), now = new Date();
    var s = p2(d.getDate()) + ' ' + MES[d.getMonth()];
    if (d.getFullYear() !== now.getFullYear()) s += ' ' + d.getFullYear();
    return s + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  }
  function ago(ts) {
    var m = Math.floor((Date.now() - ts) / 60000);
    if (m < 1) return 'agora mesmo';
    if (m < 60) return 'há ' + m + ' min';
    var h = Math.floor(m / 60);
    if (h < 24) return 'há ' + h + ' h';
    var d = Math.floor(h / 24);
    return 'há ' + d + (d === 1 ? ' dia' : ' dias');
  }
  function when(ts) { return cfg.date === 'relativa' && Date.now() - ts < 7 * 86400000 ? ago(ts) : fmt(ts); }
  function dayKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function tagsOf(text) {
    var seen = {}, res = [], re = /#([\p{L}\p{N}_]+)/gu, m;
    while ((m = re.exec(text))) { var t = norm(m[1]); if (!seen[t]) { seen[t] = 1; res.push(t); } }
    return res;
  }

  /* ---------- saída ---------- */
  var scrollQ = 0;
  function scrollSoon() {
    if (scrollQ) return;
    scrollQ = requestAnimationFrame(function () { scrollQ = 0; out.scrollTop = out.scrollHeight; });
  }
  var statN = -1, statEl = $('stat');
  function syncStat() {
    statN = items.length;
    if (!statEl) return;
    var k = dayKey(Date.now()), hoje = items.filter(function (x) { return dayKey(x.ts) === k; }).length;
    statEl.textContent = items.length ? items.length + (items.length === 1 ? ' pensamento' : ' pensamentos') + ' · hoje ' + hoje : 'sem pensamentos ainda';
  }
  function fxIn(el) {
    if (!cfg.anim || !el) return;
    if (el.nodeType === 11) {
      var kids = el.children;
      for (var i = 0; i < kids.length && i < 12; i++) { kids[i].classList.add('fx'); kids[i].style.animationDelay = (i * 45) + 'ms'; }
    } else if (el.nodeType === 1 && !el.classList.contains('art') && !el.classList.contains('brand')) el.classList.add('fx');
  }
  function add(el) { fxIn(el); out.appendChild(el); if (statN !== items.length) syncStat(); scrollSoon(); return el; }
  function prune() {
    var n = out.children.length;
    if (n > 1200) { var k = n - 900; while (k-- > 0 && out.firstChild) out.removeChild(out.firstChild); }
  }
  var downBtn = $('down'), downQ = 0;
  function syncDown() {
    downQ = 0;
    downBtn.hidden = out.scrollHeight - out.scrollTop - out.clientHeight < 120;
  }
  out.addEventListener('scroll', function () { if (!downQ) downQ = requestAnimationFrame(syncDown); }, { passive: true });
  downBtn.addEventListener('click', function () { out.scrollTop = out.scrollHeight; syncDown(); });
  function ln(cls, text) {
    var d = document.createElement('div');
    d.className = 'ln' + (cls ? ' ' + cls : '');
    if (text != null) d.textContent = text;
    return d;
  }
  function say(cls, text) { return add(ln(cls, text)); }
  // mensagem que aparece uma vez só: se já está na tela, troca em vez de repetir
  function sayOnce(key, cls, text) {
    var olds = out.querySelectorAll('[data-once="' + key + '"]');
    for (var i = 0; i < olds.length; i++) olds[i].remove();
    var d = say(cls, text); d.dataset.once = key; return d;
  }
  function gap() { var d = document.createElement('div'); d.className = 'gap'; add(d); }
  function grid(rows, cls) { var g = gridEl(rows, cls); add(g); return g; }
  function gridEl(rows, cls) {
    var g = document.createElement('div');
    g.className = 'grid ' + (cls || '');
    rows.forEach(function (r) {
      var a = document.createElement('span'); a.className = 'k'; a.textContent = r[0];
      var b = document.createElement('span'); b.className = 'v'; b.textContent = r[1];
      g.append(a, b);
    });
    return g;
  }
  function tagBtn(name) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'tag'; b.dataset.tag = name; b.textContent = '#' + name;
    return b;
  }
  function thEl(it) {
    var d = document.createElement('div'); d.className = 'th'; d.dataset.n = it.n;
    var id = document.createElement('span'); id.className = 'id'; id.textContent = '#' + it.n;
    var w = document.createElement('span'); w.className = 'when';
    w.textContent = when(it.ts) + (it.ed ? ' · editado' : '');
    var body = document.createElement('span'); body.className = 'body';
    it.t.split(/(#[\p{L}\p{N}_]+)/u).forEach(function (part, i) {
      if (i % 2) {
        var b = tagBtn(norm(part.slice(1))); b.textContent = part; body.appendChild(b);
      } else if (part) body.appendChild(document.createTextNode(part));
    });
    d.append(id, w, body);
    return d;
  }
  function showThoughts(list, header) {
    if (!list.length) { say('res', '↳ nada por aqui.'); return; }
    say('res', '↳ ' + header);
    var fr = document.createDocumentFragment(), last = '', days = {};
    list.forEach(function (it) { days[dayKey(it.ts)] = 1; });
    var multi = Object.keys(days).length > 1, hk = dayKey(Date.now()), yk = dayKey(Date.now() - 86400000);
    list.forEach(function (it) {
      var dk = dayKey(it.ts);
      if (multi && dk !== last) {
        last = dk;
        var hd = document.createElement('div'); hd.className = 'dayhd';
        hd.textContent = dk === hk ? 'hoje' : dk === yk ? 'ontem' : fmt(it.ts).slice(0, fmt(it.ts).length - 6);
        fr.appendChild(hd);
      }
      fr.appendChild(thEl(it));
    });
    add(fr);
  }

  /* ---------- armazenamento ---------- */
  function saveLocal() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ items: items.map(function (x) { return { key: x.key, n: x.n, t: x.t, ts: x.ts, ed: x.ed }; }) }));
      return true;
    } catch (e) { return false; }
  }
  function loadLocal() {
    try {
      var r = localStorage.getItem(KEY);
      if (r) { var d = JSON.parse(r); if (d && Array.isArray(d.items)) return d.items; }
    } catch (e) {}
    return [];
  }
  function fail() {
    if (warned) return;
    warned = true;
    say('err', 'não consegui gravar agora. use /backup para guardar uma cópia.');
  }
  function put(it) {
    if (mode === 'cloud') {

  function parseBackup(text) {
    var d;
    try { d = JSON.parse(text.trim()); } catch (e) { return { err: 'isso não parece um backup. cole o texto completo gerado pelo /backup.' }; }
    var arr = Array.isArray(d) ? d : (d && Array.isArray(d.itens) ? d.itens : null);
    if (!arr) return { err: 'não encontrei pensamentos nesse texto.' };
    var ok = [];
    arr.forEach(function (x) {
      if (!x || typeof x.t !== 'string' || !x.t.trim() || x.t.length > 20000) return;
      var ts = +x.ts;
      if (!isFinite(ts) || ts <= 0) return;
      var o = { t: x.t.trim(), ts: ts };
      var n = parseInt(x.n, 10); if (n > 0) o.n = n;
      var ed = +x.ed; if (isFinite(ed) && ed > 0) o.ed = ed;
      ok.push(o);
    });
    if (!ok.length) return { err: 'o backup está vazio ou fora do formato.' };
    ok.sort(function (a, b) { return a.ts - b.ts; });
    return { list: ok, skipped: arr.length - ok.length };
  }
  function persistChange(removed, added) {
    if (mode === 'cloud') {

      removed = items.slice();

        used[n] = 1;
        var it = { key: newKey() + k.toString(36), n: n, t: o.t, ts: o.ts };
        if (o.ed) it.ed = o.ed;
        items.push(it); added.push(it);
      });
    } else {
      var have = {};
      items.forEach(function (x) { have[x.ts + '|' + x.t] = 1; });
      r.list.forEach(function (o, k) {
        if (have[o.ts + '|' + o.t]) { dup++; return; }
        have[o.ts + '|' + o.t] = 1;
        var it = { key: newKey() + k.toString(36), n: nextN(), t: o.t, ts: o.ts };
        if (o.ed) it.ed = o.ed;

  /* ---------- ferramentas de rede ---------- */
  function normUrl(s) {
    s = (s || '').trim();
    if (!s) return null;
    if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
    try {
      var u = new URL(s);

      return u;
    } catch (e) { return null; }
  }

    });
  }

  function probe(href, ms) {
    var t0 = performance.now();
    var u = href + (href.indexOf('?') === -1 ? '?' : '&') + '_=' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    return withTimeout(ms, function (signal) {
      return fetch(u, { mode: 'no-cors', cache: 'no-store', credentials: 'omit', signal: signal });
    }).then(
      function () { return { ok: true, ms: performance.now() - t0 }; },
      function () { return { ok: false, ms: performance.now() - t0, timeout: performance.now() - t0 >= ms - 50 }; }
    );
  }
  function cmdIp() {

    }).catch(function () {

    }).then(function (d) {

  function cmdPing(arg) {
    if (!needNet()) return;

      if (i === N) {
        var ok = res.filter(function (r) { return r.ok; }).map(function (r) { return r.ms; });
        if (!ok.length) { el.className = 'ln err'; el.textContent = host + ' não respondeu. fora do ar, ou o navegador bloqueou o teste.'; return; }
        var sum = ok.reduce(function (a, b) { return a + b; }, 0);

    '⠀⠀⠀⠀⠀⠀⣀⣀⣼⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡿⠦',
    '⠀⠀⣤⣶⣾⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡿⠋⠁⠀⠀⠀',
    '⢀⣾⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡿⠿⠛⠋⠙⠻⣿⣿⡟⠀⠀⠀⠀⠀⠀',
    '⠚⠛⠛⠛⠛⠻⠿⠿⠿⠿⠿⠛⠛⠛⠛⠛⠋⠉⠉⣠⠄⠀⣀⣀⣀⣀⡀⠈⠻⠃⠀⠀⠀⠀⠀⠀',
    '⠀⠀⠀⠀⠀⠀⢀⣀⡀⠀⡀⠲⠶⣶⣶⣶⡆⢠⣾⠿⠞⠛⠛⠉⠉⠉⠉⠀⠀⠀⠀⠀⠀⠀⠀⠀',
    '⠀⠀⠀⠀⠀⠀⠈⠉⠉⠙⣛⠦⠙⣿⡿⠟⠀⠉⣠⣴⣶⣶⡆⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀',
    '⠀⠀⠀⠀⠀⠀⠀⠀⠀⠘⠛⠃⠀⢸⣿⣼⣦⣤⣉⡙⠋⢉⣠⡔⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀',
    '⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢸⣿⣿⣿⣿⡟⠿⠛⠛⠉⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀',
    '⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢸⣿⣿⡿⠛⠋⠀⠀⢀⣀⣀⣤⣤⣀⣀⠀⠀⠀⠀⠀⠀⠀⠀',
    '⠀⠀⠀⠀⠀⠀⠀⢀⣀⣤⣤⣤⣀⠈⠛⠉⠀⠀⠀⠰⣾⣿⣿⣿⣿⣿⣿⣿⣿⣶⣄⠀⠀⠀⠀⠀',
    '⠀⠀⠀⠀⠀⣠⣾⣿⣿⣿⠿⠋⢁⡄⠀⢀⣤⣾⣷⣦⣤⣉⣙⠛⠛⠛⠛⠛⠛⠛⠛⠷⠄⠀⠀⠀',
    '⠀⠀⠀⢀⣾⣿⡿⠟⠉⠀⣠⣾⡟⠀⣴⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣇⠀⠀⠀⠀⠀⠀',
    '⠀⠀⠀⣾⠟⠉⠀⠀⢀⣼⣿⣿⠁⣼⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡟⠹⢿⣦⠀⠀⠀⠀⠀',
    '⠀⠀⠀⠁⠀⠀⠀⠀⣾⣿⣿⡏⠀⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡟⠁⠀⠀⠉⠓⠀⠀⠀⠀',
    '⠀⠀⠀⠀⠀⠀⠀⢸⣿⣿⣿⡇⠀⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡿⠋⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀',
    '⠀⠀⠀⠀⠀⠀⠀⢸⣿⣿⣿⣿⠀⢹⣿⣿⣿⣿⣿⣿⣿⣿⣿⠟⠁⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀',
    '⠀⠀⠀⠀⠀⠀⠀⠸⣿⣿⢿⣿⡆⠀⠛⢸⣿⣿⣿⣿⣿⣿⠃⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀',
    '⠀⠀⠀⠀⠀⠀⠀⠀⠻⠁⠘⣿⣿⡄⠀⠈⣿⣿⣿⣿⣿⠃⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀',
    '⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠘⢿⣿⡄⠀⢹⣿⣿⣿⡏⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀',
    '⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠈⠻⣿⣆⠀⠻⣿⣿⡇⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀',
    '⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠙⠳⠀⠙⢿⣇⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀',
    '⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠙⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀'
  ];
  // deixa os pontos do desenho quadrados, seja qual for a fonte do aparelho
  function fixArt(el) {
    if (!el || !el.isConnected) return;
    var probe = document.createElement('span');
    probe.style.cssText = 'display:inline-block;white-space:pre;position:absolute;visibility:hidden;left:0;top:0';
    probe.textContent = ART[0];
    el.appendChild(probe);
    var w = probe.offsetWidth, h = probe.offsetHeight;
    el.removeChild(probe);
    if (!w || !h) return;
    var cellW = w / ART[0].length, sx = (h / 2) / cellW;
    if (sx > 0.5 && sx < 1.6) el.style.scale = sx.toFixed(3) + ' 1';
  }
  function drawArt(el) {
    el.textContent = ART.join('\n');
    fixArt(el);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { fixArt(el); });
  }
  drawArt($('g-art'));
  var term = document.querySelector('.term');
  var gate = $('gate'), gUser = $('g-user'), gPass = $('g-pass'), gKeep = $('g-keep'), gGo = $('g-go'), gMsg = $('g-msg');
  var AUTH = 'be456ad2f02076084535ca52d99a17fb78646e1bb0de2bf278cbb51f3a0715d9';
  var AUTH_KEY = 'pensamentos.auth.v1', PW_KEY = 'pensamentos.pw.v1', fails = 0;
  var CODE_SALT = 'pensamentos-recuperacao-v1';
  var CODE_HASH = 'e0e3c7650941cc382c159467c6ff38df1e4dd89a5e831ba309346ad9eab34423';
  var KDF_ITER = 150000;
  var EXTRA = [{ salt: '33602fa8bcbd3ae51434e35840542e56', hash: 'd9f1aebef3e187fb2e5bc6bf8acdb3a0e7b89e81807b021de7847f3bd0fa20cc' }]; // logins adicionais (só o hash, nunca a senha)

  if (window.MutationObserver) new MutationObserver(function () {
    if (!gMsg.textContent) return;
    gMsg.classList.remove('shake'); void gMsg.offsetWidth; gMsg.classList.add('shake');
  }).observe(gMsg, { childList: true, characterData: true, subtree: true });

  function getOverride() {
    try {
      var o = JSON.parse(localStorage.getItem(PW_KEY));
      if (o && typeof o.hash === 'string' && typeof o.salt === 'string') return o;
    } catch (e) {}
    return null;
  }
  function authToken() { var o = getOverride(); return 'ok:' + (o ? o.hash : AUTH); }
  function hex(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  function kdf(secret, salt) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt), iterations: KDF_ITER }, k, 256);
    }).then(hex);
  }
  function verifyOwner(u, p) {
    var o = getOverride();
    if (o) return kdf(u + '|' + p, o.salt).then(function (h) { return h === o.hash; });
    return sha('pensamentos|' + u + '|' + p).then(function (h) { return h === AUTH; });
  }
  function verifyLogin(u, p) {
    return verifyOwner(u, p).then(function (ok) {
      if (ok) return true;
      return Promise.all(EXTRA.map(function (x) {
        return kdf(u + '|' + p, x.salt).then(function (h) { return h === x.hash; });
      })).then(function (r) { return r.indexOf(true) !== -1; });
    });
  }
  function verifyCode(c) {
    var norm1 = String(c).trim().replace(/^:+/, '').trim().toLowerCase();
    return kdf(norm1, CODE_SALT).then(function (h) { return h === CODE_HASH; });
  }
  function setPassword(np) {
    var hadLocal = false;
    try { hadLocal = !!localStorage.getItem(AUTH_KEY); } catch (e) {}
    var salt = hex(crypto.getRandomValues(new Uint8Array(16)));
    return kdf('cant|' + np, salt).then(function (h) {
      try { localStorage.setItem(PW_KEY, JSON.stringify({ salt: salt, hash: h })); } catch (e) { throw new Error('storage'); }
      try { sessionStorage.setItem(AUTH_KEY, authToken()); } catch (e) {}
      if (hadLocal) { try { localStorage.setItem(AUTH_KEY, authToken()); } catch (e) {} }
    });
  }
  function pwRule(a, b) {
    if (a.length < 8) return 'a senha precisa de pelo menos 8 caracteres.';
    if (a !== b) return 'as duas senhas não são iguais.';
    return '';
  }

  var USER_KEY = 'pensamentos.user.v1';
  function curUser() {
    var u = '';
    try { u = sessionStorage.getItem(USER_KEY) || ''; } catch (e) {}
    if (!u) { try { u = localStorage.getItem(USER_KEY) || ''; } catch (e) {} }
    u = u.toLowerCase().replace(/[^a-z0-9._-]/g, '').slice(0, 16);
    return u || 'mente';
  }
  function promptTxt() { return curUser() + ':~$'; }
  function rememberUser(u, keep) {
    u = String(u || '').toLowerCase().replace(/[^a-z0-9._-]/g, '').slice(0, 16);
    if (!u) return;
    try { sessionStorage.setItem(USER_KEY, u); } catch (e) {}
    if (keep) { try { localStorage.setItem(USER_KEY, u); } catch (e) {} }
  }
  function stored() {
    try { if (sessionStorage.getItem(AUTH_KEY) === authToken()) return true; } catch (e) {}
    try { if (localStorage.getItem(AUTH_KEY) === authToken()) return true; } catch (e) {}
    return false;
  }
  function sha(s) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    });
  }
  function cmdSair() {
    try { sessionStorage.removeItem(USER_KEY); localStorage.removeItem(USER_KEY); } catch (e) {}
    try { sessionStorage.removeItem(AUTH_KEY); } catch (e) {}
    try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
    say('ok', 'trancado. até logo.');
    setTimeout(function () { try { location.reload(); } catch (e) {} }, 400);
  }

  function boot() {
    inp.disabled = true;
    say('dim', 'iniciando…');
    initStore().then(function () {
      out.textContent = '';
      modeEl.textContent = mode === 'cloud' ? 'cofre privado' : 'neste aparelho';
      welcome();
      inp.disabled = false;
      var dst = drvLoad(); if (dst.resume) { dst.resume = 0; drvSave(dst); cmdDrive(''); }
      if (window.matchMedia('(pointer: fine)').matches) { try { inp.focus({ preventScroll: true }); } catch (e) {} }
    });
  }
  function enter(keep, user) {
    if (user) rememberUser(user, keep);
    var lab = document.querySelector('.prompt');
    if (lab) lab.textContent = promptTxt();
    try { sessionStorage.setItem(AUTH_KEY, authToken()); } catch (e) {}
    if (keep) { try { localStorage.setItem(AUTH_KEY, authToken()); } catch (e) {} }
    gate.hidden = true;
    term.hidden = false;
    lastAct = Date.now();
    grow();
    boot();
  }

  gate.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!(window.crypto && crypto.subtle)) { gMsg.textContent = 'este navegador não consegue verificar a senha aqui.'; return; }
    var u = gUser.value.trim().toLowerCase(), p = gPass.value;
    gGo.disabled = true;
    verifyLogin(u, p).then(function (okLogin) {
      if (okLogin) { gMsg.textContent = ''; gPass.value = ''; enter(gKeep.checked, u); return; }
      fails++;
      gPass.value = '';
      gMsg.textContent = 'login ou senha incorretos.';
      setTimeout(function () { gGo.disabled = false; gPass.focus(); }, Math.min(fails, 8) * 800);
    }).catch(function () {
      gMsg.textContent = 'não consegui verificar. tente de novo.';
      gGo.disabled = false;
    });
  });


  /* ---------- trancar sozinho ---------- */
  var lastAct = Date.now(), hiddenAt = 0;
  function lockMs() { return cfg.lock > 0 ? cfg.lock * 60000 : 0; }
  function touch() { lastAct = Date.now(); }
  ['pointerdown', 'keydown', 'touchstart', 'scroll', 'input'].forEach(function (ev) {
    document.addEventListener(ev, touch, { passive: true, capture: true });
  });
  function lockNow() {
    try { ntsRelock(); } catch (e) {}
    try { sessionStorage.removeItem(USER_KEY); localStorage.removeItem(USER_KEY); } catch (e) {}
    try { sessionStorage.removeItem(AUTH_KEY); } catch (e) {}
    try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
    term.hidden = true; gate.hidden = false;
    out.textContent = ''; inp.value = '';
    try { location.reload(); } catch (e) {}
  }
  setInterval(function () {
    var lim = lockMs();
    if (!term.hidden && lim && Date.now() - lastAct > lim) lockNow();
  }, 10000);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    var lim = lockMs();
    if (!term.hidden && lim && hiddenAt && Date.now() - hiddenAt > lim) { hiddenAt = 0; lockNow(); return; }
    hiddenAt = 0; lastAct = Date.now();
  });

  /* ---------- recuperar acesso (tela de login) ---------- */
  var rec = $('rec'), rCode = $('r-code'), rNew = $('r-new'), rNew2 = $('r-new2'), rGo = $('r-go'), rMsg = $('r-msg');
  function showRec(on) {
    rec.hidden = !on; gate.hidden = on;
    rMsg.textContent = '';
    try { (on ? rCode : gUser).focus(); } catch (e) {}
  }
  $('g-forgot').addEventListener('click', function () { showRec(true); });
  $('r-back').addEventListener('click', function () { showRec(false); });
  rec.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!(window.crypto && crypto.subtle)) { rMsg.textContent = 'este navegador não consegue verificar aqui.'; return; }
    var bad = pwRule(rNew.value, rNew2.value);
    if (bad) { rMsg.textContent = bad; return; }
    rGo.disabled = true;
    verifyCode(rCode.value).then(function (ok) {
      if (!ok) {
        fails++; rCode.value = '';
        rMsg.textContent = 'código incorreto.';
        setTimeout(function () { rGo.disabled = false; rCode.focus(); }, Math.min(fails, 8) * 800);
        return;
      }
      return setPassword(rNew.value).then(function () {
        try { sessionStorage.removeItem(AUTH_KEY); } catch (e) {}
        try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
        rCode.value = ''; rNew.value = ''; rNew2.value = ''; rGo.disabled = false;
        showRec(false);
        gMsg.textContent = 'senha trocada. entre com a nova.';
      });
    }).catch(function () {
      rMsg.textContent = 'não consegui salvar a senha neste navegador.';
      rGo.disabled = false;
    });
  });

  function cmdTrocarSenha() {
    var box = panelBox();
    box.appendChild(mkNote('a nova senha vale só neste aparelho. nos outros, continua a senha antiga. o código de recuperação é obrigatório.'));
    function fld(id, label, type) {
      var wrap = document.createElement('div'); wrap.className = 'row';
      var l = document.createElement('label'); l.className = 'lab'; l.htmlFor = id; l.textContent = label;
      var i = document.createElement('input'); i.id = id; i.type = type;
      i.autocomplete = type === 'password' ? 'new-password' : 'off';
      i.setAttribute('autocapitalize', 'none'); i.spellcheck = false;
      i.style.cssText = 'font:inherit;font-size:max(16px,1em);color:var(--fg);background:transparent;border:1px solid var(--line);padding:0.3rem 1ch;min-width:0;width:100%;box-sizing:border-box;';
      wrap.append(l, i);
      box.appendChild(wrap);
      return i;
    }
    var fc = fld('tp-code', 'código', 'text');
    var f1 = fld('tp-new', 'nova', 'password');
    var f2 = fld('tp-new2', 'repetir', 'password');
    var row = document.createElement('div'); row.className = 'ctl';
    var busy = false;
    row.appendChild(mkBtn('trocar senha', function () {
      if (busy) return;
      if (!(window.crypto && crypto.subtle)) { say('err', 'este navegador não consegue verificar a senha aqui.'); return; }
      var bad = pwRule(f1.value, f2.value);
      if (!fc.value.trim()) bad = 'digite o código de recuperação.';
      if (bad) { say('err', bad); return; }
      busy = true;
      verifyCode(fc.value).then(function (ok) {
        if (!ok) { say('err', 'código incorreto. nada foi alterado.'); return; }
        return setPassword(f1.value).then(function () {
          box.remove();
          say('ok', 'senha trocada neste aparelho.');
        });
      }).catch(function () { say('err', 'não consegui salvar a nova senha neste navegador.'); })
        .then(function () { busy = false; });
    }));
    box.appendChild(row);
    add(box);
    try { fc.focus(); } catch (e) {}
  }

  if (stored()) enter(false);
  else { try { gUser.focus(); } catch (e) {} }
})();
</script>
