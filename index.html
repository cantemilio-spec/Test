<title>EMRYS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Uncial+Antiqua&display=swap">
<style>
/* Layout: terminal em tela cheia. Barra de status no topo, histórico rolável no meio, atalhos e linha de comando presos embaixo. */
:root {
  --bg: #14110d;
  --fg: #e6dac2;
  --dim: #8c7f6a;
  --accent: #ffb000;
  --line: #2d271e;
  --ok: #9bd48f;
  --err: #ff8470;
  --sel: rgba(255, 176, 0, 0.25);
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --display: 'Uncial Antiqua', 'Cinzel', Georgia, 'Times New Roman', serif;
  --fs: 14px;
  --rune: #e3a63c;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eceee6;
    --fg: #1f2418;
    --dim: #636a58;
    --accent: #8a5200;
    --line: #d3d6c9;
    --ok: #2c6f35;
    --err: #a8281c;
    --sel: rgba(138, 82, 0, 0.2);
    --rune: #8f5a0e;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eceee6;
  --fg: #1f2418;
  --dim: #636a58;
  --accent: #8a5200;
  --line: #d3d6c9;
  --ok: #2c6f35;
  --err: #a8281c;
  --sel: rgba(138, 82, 0, 0.2);
  --rune: #8f5a0e;
  color-scheme: light;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  padding-block: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bg);
  color: var(--fg);
  font: var(--fs, 14px)/1.5 var(--mono);
}
::selection { background: var(--sel); }
.term {
  height: 100%;
  max-width: 880px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
}

.bar {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  padding-block: 0.75rem 0.6rem;
  border-bottom: 1px solid var(--line);
  font-size: 0.75em;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--dim);
}
.blk { color: var(--accent); margin-right: 0.6ch; }
.clock { font-variant-numeric: tabular-nums; color: var(--fg); }

.out {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding-block: 1rem 0.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  scrollbar-width: thin;
  scrollbar-color: var(--line) transparent;
  overscroll-behavior: contain;
}
.ln { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.dim, .res { color: var(--dim); }
.ok { color: var(--ok); }
.err { color: var(--err); }
.gap { height: 0.5rem; flex: none; }
.brand {
  font-family: var(--display);
  font-size: clamp(2.4rem, 9vw, 3.2rem);
  line-height: 0.9;
  letter-spacing: 0.02em;
  color: var(--accent);
}
.echo .p { color: var(--accent); margin-right: 1ch; }
.raw {
  border-left: 2px solid var(--line);
  padding-left: 1.5ch;
  user-select: text;
}

.th {
  display: grid;
  grid-template-columns: 6ch minmax(0, 1fr);
  column-gap: 1ch;
  padding-block: 0.4rem;
  border-top: 1px dashed var(--line);
}
.th .id { grid-row: 1 / 3; color: var(--accent); }
.th .when { color: var(--dim); font-size: 0.8em; }
.th .body { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
.tag {
  font: inherit;
  color: var(--accent);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-decoration: underline dotted;
  text-underline-offset: 3px;
}
.tagcloud { display: flex; flex-wrap: wrap; gap: 0.25rem 2ch; }

.grid {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  gap: 0.2rem 2ch;
  margin-block: 0.2rem;
}
.grid .k { color: var(--accent); }
.grid.stat .k { color: var(--dim); }
.grid .v { min-width: 0; overflow-wrap: anywhere; }
.grid.help .v { color: var(--dim); }

.chips {
  display: flex;
  gap: 0.5rem;
  overflow-x: auto;
  padding-block: 0.5rem;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  font: inherit;
  font-size: 0.8em;
  color: var(--dim);
  background: transparent;
  border: 1px solid var(--line);
  padding: 0.2rem 1.2ch;
  cursor: pointer;
}
.chip:hover, .chip[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
.chip:focus-visible, .send:focus-visible, .tag:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

.line {
  display: flex;
  align-items: flex-start;
  gap: 1ch;
  padding-block: 0.6rem;
  border-top: 1px solid var(--line);
}
.line:focus-within { border-top-color: var(--accent); }
.prompt { color: var(--accent); white-space: nowrap; }
#in {
  flex: 1;
  min-width: 0;
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border: 0;
  outline: none;
  resize: none;
  background: transparent;
  color: var(--fg);
  caret-color: var(--accent);
  font: inherit;
  font-size: max(16px, 1em);
  max-height: 10rem;
}
#in:disabled { opacity: 0.4; }
.send {
  flex: none;
  align-self: flex-end;
  font: inherit;
  line-height: 1.2;
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--line);
  padding: 0.1rem 1.2ch;
  cursor: pointer;
}
.send:hover { border-color: var(--accent); }

.cfg {
  display: grid;
  gap: 0.9rem;
  margin-block: 0.25rem;
  padding: 0.8rem 1.5ch;
  border: 1px solid var(--line);
}
.cfg .row {
  display: grid;
  grid-template-columns: 9ch minmax(0, 1fr);
  gap: 0.4rem 2ch;
  align-items: center;
}
.cfg .lab { color: var(--dim); }
.cfg .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; min-width: 0; }
.cfg .opt {
  font: inherit;
  font-size: 0.85em;
  display: inline-flex;
  align-items: center;
  gap: 0.8ch;
  color: var(--fg);
  background: transparent;
  border: 1px solid var(--line);
  padding: 0.1rem 1ch;
  cursor: pointer;
}
.cfg .opt:hover { border-color: var(--accent); }
.cfg .opt[aria-pressed="true"] { border-color: var(--accent); }
.cfg .opt:focus-visible, .cfg input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cfg .dot { width: 0.9em; height: 0.9em; border: 1px solid var(--line); display: inline-block; }
.cfg input[type="color"] {
  width: 2.6rem;
  height: 1.8rem;
  padding: 0;
  border: 1px solid var(--line);
  background: transparent;
  cursor: pointer;
}
.cfg input[type="range"] { flex: 1; min-width: 8rem; accent-color: var(--accent); }
.cfg .val { font-variant-numeric: tabular-nums; min-width: 5ch; }
.cfg .sample { color: var(--fg); margin: 0; }
@media (max-width: 480px) {
  .cfg .row { grid-template-columns: 1fr; }
}

.mark.sm { display: inline-block; width: 1.5em; height: 1.5em; vertical-align: -0.35em; margin-right: 0.8ch; }
.mark.md { width: clamp(88px, 22vw, 128px); aspect-ratio: 1; margin-block: 0.25rem 0.5rem; }
.art {
  margin: 0;
  box-sizing: border-box;
  width: fit-content;
  max-width: 100%;
  font-family: 'DejaVu Sans Mono', 'Apple Braille', 'Segoe UI Symbol', 'Noto Sans Symbols 2', 'Menlo', var(--mono), monospace;
  font-size: min(10px, calc((100vw - 48px) / 30));
  line-height: 1;
  white-space: pre;
  color: var(--rune);
  user-select: text;
  overflow: hidden;
}

.gate {
  box-sizing: border-box;
  height: 100%;
  max-width: 360px;
  margin-inline: auto;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 1rem;
  padding-block: 1.5rem;
}
.gate .brand { margin: 0; }
.gate .sub { margin: 0; color: var(--dim); }
.gate .fld { display: flex; align-items: baseline; gap: 1ch; border-bottom: 1px solid var(--line); padding-block: 0.4rem; }
.gate .fld:focus-within { border-bottom-color: var(--accent); }
.gate .fld label { color: var(--accent); white-space: nowrap; }
.gate .fld input {
  flex: 1;
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--fg);
  caret-color: var(--accent);
  font: inherit;
  font-size: max(16px, 1em);
}
.gate .keep { display: flex; align-items: center; gap: 1ch; color: var(--dim); font-size: 0.85em; }
.gate .keep input { accent-color: var(--accent); margin: 0; }
.gate .go {
  align-self: flex-start;
  font: inherit;
  color: var(--accent);
  background: transparent;
  border: 1px solid var(--accent);
  padding: 0.25rem 2ch;
  cursor: pointer;
}
.gate .go:disabled { opacity: 0.4; cursor: default; }
.gate .go:focus-visible, .gate .keep input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.gate .msg { margin: 0; min-height: 1.5em; color: var(--err); }
.gate .lnk {
  align-self: flex-start;
  font: inherit;
  font-size: 0.85em;
  color: var(--dim);
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-decoration: underline dotted;
  text-underline-offset: 3px;
}
.gate .lnk:hover { color: var(--accent); }
.gate .lnk:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- login: visual emrys ---- */
.wm {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(3rem, 15vw, 4.4rem);
  line-height: 1;
  letter-spacing: 0.1em;
  text-align: center;
  color: var(--fg);
  text-shadow: 0 0 26px rgba(227, 166, 60, 0.3);
}
.wm.sm { font-size: clamp(2rem, 10vw, 2.8rem); text-align: left; }
.wm .cur {
  display: inline-block;
  width: 0.42em;
  height: 0.07em;
  margin-left: 0.14em;
  background: var(--rune);
  animation: emrys-blink 1.1s steps(1) infinite;
}
@keyframes emrys-blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .wm .cur { animation: none; } }
.gate { max-width: 420px; gap: 0.8rem; }
.gate .hero { display: flex; flex-direction: column; align-items: center; margin-bottom: 0.2rem; }
.gate .hero .art { font-size: min(10px, calc((100vw - 48px) / 30)); }
.gate .hero .wm { margin-top: 1rem; position: relative; }
.gate .sub {
  text-align: center;
  font-size: 0.72em;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  margin-bottom: 0.4rem;
}
.gate .fld {
  align-items: center;
  gap: 1.4ch;
  min-height: 2.9rem;
  padding: 0.3rem 1.4ch;
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--fg) 4%, var(--bg));
}
.gate .fld:focus-within { border-color: var(--rune); }
.gate .fld label {
  min-width: 6ch;
  font-size: 0.75em;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--dim);
}
.gate .keep { justify-content: center; }
.gate .go {
  align-self: stretch;
  min-height: 2.9rem;
  text-align: center;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--rune);
  border-color: var(--rune);
}
.gate .go:hover:not(:disabled) { background: var(--rune); color: var(--bg); }
.gate .lnk { align-self: center; }
.gate .msg { text-align: center; }
.gate { justify-content: flex-start; }
.gate > :first-child { margin-top: auto; }
.gate > :last-child { margin-bottom: auto; }

.cfg textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 6rem;
  max-height: 14rem;
  resize: vertical;
  margin: 0;
  padding: 0.5rem 1ch;
  color: var(--fg);
  background: transparent;
  border: 1px solid var(--line);
  font: inherit;
  font-size: max(16px, 1em);
  line-height: 1.4;
}
.cfg textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.cfg input[type="file"] { font: inherit; font-size: 0.85em; color: var(--fg); max-width: 100%; }
.cfg .note { margin: 0; color: var(--dim); font-size: 0.85em; }
.cfg .stack { display: grid; gap: 0.6rem; min-width: 0; }
</style>

<div class="term" hidden>
  <header class="bar">
    <span><span class="mark sm" role="img" aria-label="Logo"></span>EMRYS · <span id="mode">iniciando</span></span>
    <time id="clock" class="clock">--:--</time>
  </header>
  <main id="out" class="out" role="log" aria-live="polite" aria-label="Histórico do terminal"></main>
  <nav class="chips" aria-label="Atalhos">
    <button type="button" class="chip" data-cmd="ajuda">/ajuda</button>
    <button type="button" class="chip" data-cmd="listar">/listar</button>
    <button type="button" class="chip" data-cmd="hoje">/hoje</button>
    <button type="button" class="chip" data-cmd="relembrar">/relembrar</button>
    <button type="button" class="chip" data-cmd="tags">/tags</button>
    <button type="button" class="chip" data-cmd="stats">/stats</button>
    <button type="button" class="chip" data-cmd="config">/config</button>
  </nav>
  <form id="f" class="line" autocomplete="off">
    <label for="in" class="prompt">mente:~$</label>
    <textarea id="in" rows="1" spellcheck="false" autocapitalize="sentences" enterkeyhint="send" aria-label="Escreva um pensamento ou um comando"></textarea>
    <button class="send" type="submit" aria-label="Guardar">↵</button>
  </form>
</div>

<form id="gate" class="gate" autocomplete="on">
  <div class="hero">
    <pre id="g-art" class="art" role="img" aria-label="Um mago de chapéu e barba, desenhado com pontos"></pre>
    <h1 class="wm">EMRYS</h1>
  </div>
  <p class="sub">acesso restrito</p>
  <div class="fld">
    <label for="g-user">login</label>
    <input id="g-user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  </div>
  <div class="fld">
    <label for="g-pass">senha</label>
    <input id="g-pass" type="password" autocomplete="current-password" required>
  </div>
  <label class="keep" for="g-keep"><input id="g-keep" type="checkbox"> manter conectado neste aparelho</label>
  <button id="g-go" class="go" type="submit">entrar</button>
  <button id="g-forgot" class="lnk" type="button">esqueci a senha</button>
  <p id="g-msg" class="msg" role="alert"></p>
</form>

<form id="rec" class="gate" autocomplete="off" hidden>
  <h1 class="wm sm">RECUPERAR</h1>
  <p class="sub">digite o código de recuperação e escolha uma senha nova.</p>
  <div class="fld">
    <label for="r-code">código:</label>
    <input id="r-code" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" required>
  </div>
  <div class="fld">
    <label for="r-new">nova senha:</label>
    <input id="r-new" type="password" autocomplete="new-password" required>
  </div>
  <div class="fld">
    <label for="r-new2">repetir:</label>
    <input id="r-new2" type="password" autocomplete="new-password" required>
  </div>
  <button id="r-go" class="go" type="submit">definir senha</button>
  <button id="r-back" class="lnk" type="button">voltar ao login</button>
  <p id="r-msg" class="msg" role="alert"></p>
</form>

<script>
(function () {
  'use strict';
  var KEY = 'pensamentos.v2';
  var VERSION = '1.6.3', BUILD = '2026-11-05';
  var $ = function (id) { return document.getElementById(id); };
  var out = $('out'), f = $('f'), inp = $('in'), modeEl = $('mode'), clock = $('clock');
  var MES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];

  var items = [], mode = 'local', coll = null;
  var hist = [], hi = 0, lastDeleted = null, wipe = false, warned = false;

  function p2(n) { return String(n).padStart(2, '0'); }
  function norm(s) { return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function sortItems() { items.sort(function (a, b) { return (a.ts - b.ts) || ((a.n || 0) - (b.n || 0)); }); }

  function tick() { var d = new Date(); clock.textContent = p2(d.getHours()) + ':' + p2(d.getMinutes()); }
  tick(); setInterval(tick, 15000);
  var taps = [];
  clock.addEventListener('click', function () {
    var now = Date.now();
    taps = taps.filter(function (t) { return now - t < 2500; });
    taps.push(now);
    if (taps.length >= 5) { taps = []; if (!inp.disabled) run('/versao'); }
  });

  function fmt(ts) {
    var d = new Date(ts), now = new Date();
    var s = p2(d.getDate()) + ' ' + MES[d.getMonth()];
    if (d.getFullYear() !== now.getFullYear()) s += ' ' + d.getFullYear();
    return s + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  }
  function ago(ts) {
    var m = Math.floor((Date.now() - ts) / 60000);
    if (m < 1) return 'agora mesmo';
    if (m < 60) return 'há ' + m + ' min';
    var h = Math.floor(m / 60);
    if (h < 24) return 'há ' + h + ' h';
    var d = Math.floor(h / 24);
    return 'há ' + d + (d === 1 ? ' dia' : ' dias');
  }
  function dayKey(ts) { var d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  function tagsOf(text) {
    var seen = {}, res = [], re = /#([\p{L}\p{N}_]+)/gu, m;
    while ((m = re.exec(text))) { var t = norm(m[1]); if (!seen[t]) { seen[t] = 1; res.push(t); } }
    return res;
  }

  /* ---------- saída ---------- */
  function add(el) { out.appendChild(el); out.scrollTop = out.scrollHeight; return el; }
  function ln(cls, text) {
    var d = document.createElement('div');
    d.className = 'ln' + (cls ? ' ' + cls : '');
    if (text != null) d.textContent = text;
    return d;
  }
  function say(cls, text) { return add(ln(cls, text)); }
  function gap() { var d = document.createElement('div'); d.className = 'gap'; add(d); }
  function grid(rows, cls) {
    var g = document.createElement('div');
    g.className = 'grid ' + (cls || '');
    rows.forEach(function (r) {
      var a = document.createElement('span'); a.className = 'k'; a.textContent = r[0];
      var b = document.createElement('span'); b.className = 'v'; b.textContent = r[1];
      g.append(a, b);
    });
    add(g);
  }
  function tagBtn(name) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'tag'; b.dataset.tag = name; b.textContent = '#' + name;
    return b;
  }
  function thEl(it) {
    var d = document.createElement('div'); d.className = 'th';
    var id = document.createElement('span'); id.className = 'id'; id.textContent = '#' + it.n;
    var w = document.createElement('span'); w.className = 'when';
    w.textContent = fmt(it.ts) + (it.ed ? ' · editado' : '');
    var body = document.createElement('span'); body.className = 'body';
    it.t.split(/(#[\p{L}\p{N}_]+)/u).forEach(function (part, i) {
      if (i % 2) {
        var b = tagBtn(norm(part.slice(1))); b.textContent = part; body.appendChild(b);
      } else if (part) body.appendChild(document.createTextNode(part));
    });
    d.append(id, w, body);
    return d;
  }
  function showThoughts(list, header) {
    if (!list.length) { say('res', '↳ nada por aqui.'); return; }
    say('res', '↳ ' + header);
    list.forEach(function (it) { add(thEl(it)); });
  }

  /* ---------- armazenamento ---------- */
  function saveLocal() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ items: items.map(function (x) { return { key: x.key, n: x.n, t: x.t, ts: x.ts, ed: x.ed }; }) }));
      return true;
    } catch (e) { return false; }
  }
  function loadLocal() {
    try {
      var r = localStorage.getItem(KEY);
      if (r) { var d = JSON.parse(r); if (d && Array.isArray(d.items)) return d.items; }
    } catch (e) {}
    return [];
  }
  function fail() {
    if (warned) return;
    warned = true;
    say('err', 'não consegui gravar agora. use /backup para guardar uma cópia.');
  }
  function put(it) {
    if (mode === 'cloud') {
      var body = { n: it.n, t: it.t, ts: it.ts };
      if (it.ed) body.ed = it.ed;
      return coll.doc(it.key).set(body).catch(fail);
    }
    if (!saveLocal()) fail();
  }
  function drop(it) {
    if (mode === 'cloud') return coll.doc(it.key).delete().catch(fail);
    if (!saveLocal()) fail();
  }

  function initStore() {
    function timeout(ms, v) { return new Promise(function (r) { setTimeout(function () { r(v); }, ms); }); }
    function useLocal() { mode = 'local'; coll = null; items = loadLocal(); sortItems(); }
    var c = window.claude;
    if (!c || typeof c.use !== 'function') { useLocal(); return Promise.resolve(); }
    return Promise.race([Promise.all([c.use('user'), c.use('db')]), timeout(4000, [null, null])])
      .then(function (r) {
        var user = r[0], db = r[1];
        if (!user || !db) return null;
        return user.id().then(function (id) { return id ? db.collection('data/users/' + id) : null; });
      })
      .then(function (col) {
        if (!col) { useLocal(); return; }
        coll = col; mode = 'cloud';
        return new Promise(function (resolve) {
          var settled = false, timedOut = false;
          var t = setTimeout(function () {
            if (!settled) { settled = true; timedOut = true; resolve(); }
          }, 6000);
          function finish() { if (!settled) { settled = true; clearTimeout(t); resolve(); } }
          try {
            coll.onSnapshot(function (snap) {
              items = snap.docs.map(function (d) { return Object.assign({ key: d.id }, d.data()); });
              sortItems();
              if (!snap.metadata.fromCache) {
                if (timedOut) { timedOut = false; say('ok', 'cofre conectado · ' + items.length + ' pensamentos carregados.'); }
                finish();
              }
            }, function () {
              if (!settled) { useLocal(); finish(); }
              else say('err', 'a conexão com o cofre caiu. recarregue a página.');
            });
          } catch (e) { useLocal(); finish(); }
        });
      })
      .catch(function () { useLocal(); });
  }

  /* ---------- configurações ---------- */
  var CFG_KEY = 'pensamentos.cfg.v2';
  var cfg = { color: '', size: 14, lock: 5 };
  var SWATCHES = [['âmbar', '#ffb000'], ['verde', '#33ff66'], ['ciano', '#4dd8e8'], ['rosa', '#ff7ac6'], ['branco', '#f2f2f2'], ['padrão', '']];
  function loadCfg() {
    try {
      var r = localStorage.getItem(CFG_KEY);
      if (r) {
        var d = JSON.parse(r);
        if (d && typeof d === 'object') {
          if (/^#[0-9a-f]{6}$/i.test(d.color)) cfg.color = d.color;
          var s = +d.size;
          if (s >= 10 && s <= 28) cfg.size = Math.round(s);
          var lk = +d.lock;
          if (isFinite(lk) && lk >= 0 && lk <= 120 && d.lock !== null && d.lock !== '') cfg.lock = Math.round(lk);
        }
      }
    } catch (e) {}
  }
  function saveCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch (e) {} }
  function applyCfg() {
    var st = document.documentElement.style;
    st.setProperty('--fs', cfg.size + 'px');
    if (cfg.color) {
      st.setProperty('--fg', cfg.color);
      st.setProperty('--accent', cfg.color);
      st.setProperty('--dim', 'color-mix(in srgb, ' + cfg.color + ' 60%, var(--bg))');
    } else {
      ['--fg', '--accent', '--dim'].forEach(function (k) { st.removeProperty(k); });
    }
    if (typeof grow === 'function') grow();
  }
  loadCfg();
  applyCfg();

  function cfgPanel() {
    var old = out.querySelectorAll('.cfg');
    for (var i = 0; i < old.length; i++) old[i].remove();
    var box = document.createElement('div'); box.className = 'cfg';

    function row(label, forId) {
      var r = document.createElement('div'); r.className = 'row';
      var l = document.createElement(forId ? 'label' : 'span'); l.className = 'lab'; l.textContent = label;
      if (forId) l.htmlFor = forId;
      var c = document.createElement('div'); c.className = 'ctl';
      r.append(l, c); box.appendChild(r);
      return c;
    }

    var cc = row('cor da fonte', 'cfg-color');
    var btns = [];
    var picker = document.createElement('input');
    picker.type = 'color'; picker.id = 'cfg-color';
    picker.value = cfg.color || '#ffb000';
    function mark() {
      btns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.c === cfg.color)); });
    }
    SWATCHES.forEach(function (s) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.dataset.c = s[1];
      var dot = document.createElement('span'); dot.className = 'dot';
      if (s[1]) dot.style.background = s[1];
      b.append(dot, document.createTextNode(s[0]));
      b.addEventListener('click', function () {
        cfg.color = s[1]; if (s[1]) picker.value = s[1];
        applyCfg(); saveCfg(); mark();
      });
      btns.push(b); cc.appendChild(b);
    });
    picker.addEventListener('input', function () {
      cfg.color = picker.value; applyCfg(); saveCfg(); mark();
    });
    cc.appendChild(picker);
    mark();

    var sc = row('tamanho', 'cfg-size');
    var range = document.createElement('input');
    range.type = 'range'; range.id = 'cfg-size'; range.min = 10; range.max = 28; range.step = 1; range.value = cfg.size;
    var val = document.createElement('span'); val.className = 'val'; val.textContent = cfg.size + ' px';
    range.addEventListener('input', function () {
      cfg.size = +range.value; val.textContent = cfg.size + ' px';
      applyCfg(); saveCfg(); out.scrollTop = out.scrollHeight;
    });
    sc.append(range, val);

    var lc = row('trancar');
    var lockBtns = [];
    function markLock() { lockBtns.forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.m === cfg.lock)); }); }
    [[0, 'nunca'], [1, '1 min'], [5, '5 min'], [15, '15 min'], [30, '30 min']].forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.dataset.m = o[0]; b.textContent = o[1];
      b.addEventListener('click', function () { cfg.lock = o[0]; lastAct = Date.now(); saveCfg(); markLock(); });
      lockBtns.push(b); lc.appendChild(b);
    });
    var ln2 = mkNote('pede o login de novo depois desse tempo parado ou fora do app.'); ln2.style.flexBasis = '100%';
    lc.appendChild(ln2);
    markLock();

    var rc = row('');
    var rs = document.createElement('button');
    rs.type = 'button'; rs.className = 'opt'; rs.textContent = 'restaurar padrão';
    rs.addEventListener('click', function () {
      cfg.color = ''; cfg.size = 14; cfg.lock = 5;
      range.value = 14; val.textContent = '14 px'; picker.value = '#ffb000';
      applyCfg(); saveCfg(); mark(); markLock();
    });
    rc.appendChild(rs);

    var smp = document.createElement('p'); smp.className = 'sample';
    smp.textContent = 'exemplo: assim ficam os seus pensamentos.';
    box.appendChild(smp);
    add(box);
  }
  function cmdConfig(arg) {
    var a = norm(arg.trim());
    if (!a) {
      cfgPanel();
      say('dim', 'também funciona por texto: /config cor verde · /config cor #33ff66 · /config tamanho 20 · /config reset');
      return;
    }
    if (a === 'reset' || a === 'padrao') {
      cfg.color = ''; cfg.size = 14; cfg.lock = 5; applyCfg(); saveCfg();
      say('ok', 'configurações restauradas.');
      return;
    }
    var m = a.match(/^(cor|tamanho|trancar)\s+(.+)$/);
    if (!m) { say('err', 'use: /config, /config cor <nome|#hex>, /config tamanho <10-28>, /config trancar <minutos|nunca>'); return; }
    if (m[1] === 'trancar') {
      var mins = (m[2] === 'nunca' || m[2] === '0') ? 0 : parseInt(m[2], 10);
      if (!(mins >= 0 && mins <= 120)) { say('err', 'use um número de 1 a 120, ou nunca.'); return; }
      cfg.lock = mins; lastAct = Date.now(); saveCfg();
      say('ok', mins ? 'vai trancar após ' + mins + ' min parado.' : 'tranca automática desligada.');
      return;
    }
    if (m[1] === 'tamanho') {
      var n = parseInt(m[2], 10);
      if (!(n >= 10 && n <= 28)) { say('err', 'o tamanho vai de 10 a 28.'); return; }
      cfg.size = n; applyCfg(); saveCfg();
      say('ok', 'tamanho da fonte: ' + n + ' px.');
      return;
    }
    var hex = m[2].match(/^#?([0-9a-f]{6})$/);
    var found = null;
    SWATCHES.forEach(function (s) { if (norm(s[0]) === m[2]) found = s; });
    if (found) cfg.color = found[1];
    else if (hex) cfg.color = '#' + hex[1];
    else { say('err', 'cor desconhecida. use ' + SWATCHES.map(function (s) { return s[0]; }).join(', ') + ' ou um código #rrggbb.'); return; }
    applyCfg(); saveCfg();
    say('ok', cfg.color ? 'cor da fonte: ' + cfg.color + '.' : 'cor da fonte restaurada.');
  }

  /* ---------- backup e restauração ---------- */
  function backupText() {
    return JSON.stringify({
      app: 'emrys', v: 1, versao: VERSION, exportado: new Date().toISOString(),
      itens: items.map(function (x) { var o = { n: x.n, t: x.t, ts: x.ts }; if (x.ed) o.ed = x.ed; return o; })
    }, null, 2);
  }
  function panelBox() {
    var old = out.querySelectorAll('.cfg');
    for (var i = 0; i < old.length; i++) old[i].remove();
    var b = document.createElement('div'); b.className = 'cfg stack';
    return b;
  }
  function mkBtn(label, fn) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'opt'; b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  }
  function mkNote(text) { var p = document.createElement('p'); p.className = 'note'; p.textContent = text; return p; }
  function p2d(n) { return String(n).padStart(2, '0'); }
  function downloadAnchor(text, name) {
    var blob = new Blob([text], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    say('dim', 'se o arquivo não baixou, use "copiar" e cole num app de notas.');
  }
  function saveBackupFile(text) {
    var d = new Date();
    var name = 'emrys-' + d.getFullYear() + '-' + p2d(d.getMonth() + 1) + '-' + p2d(d.getDate()) + '.json';
    var file = null;
    try { file = new File([text], name, { type: 'application/json' }); } catch (e) {}
    if (file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Backup dos pensamentos' }).catch(function (e) {
        if (!e || e.name !== 'AbortError') downloadAnchor(text, name);
      });
    } else downloadAnchor(text, name);
  }
  function cmdBackup() {
    if (!items.length) { say('dim', 'nada para guardar ainda. escreva um pensamento primeiro.'); return; }
    var text = backupText();
    var box = panelBox();
    box.appendChild(mkNote(items.length + (items.length === 1 ? ' pensamento' : ' pensamentos') + ' neste aparelho. guarde a cópia num lugar seguro, como o app Arquivos ou o iCloud.'));
    var ta = document.createElement('textarea');
    ta.id = 'bak-text'; ta.readOnly = true; ta.value = text; ta.setAttribute('aria-label', 'Texto do backup');
    var row = document.createElement('div'); row.className = 'ctl';
    row.appendChild(mkBtn('copiar', function () {
      function manual() { ta.focus(); ta.select(); say('dim', 'não consegui copiar sozinho. o texto está selecionado: copie manualmente.'); }
      try {
        navigator.clipboard.writeText(text).then(function () { say('ok', 'backup copiado. cole num app de notas ou mande para você mesmo.'); }).catch(manual);
      } catch (e) { manual(); }
    }));
    row.appendChild(mkBtn('salvar arquivo', function () { saveBackupFile(text); }));
    box.append(row, ta, mkNote('para voltar: /restaurar'));
    add(box);
  }

  function parseBackup(text) {
    var d;
    try { d = JSON.parse(text.trim()); } catch (e) { return { err: 'isso não parece um backup. cole o texto completo gerado pelo /backup.' }; }
    var arr = Array.isArray(d) ? d : (d && Array.isArray(d.itens) ? d.itens : null);
    if (!arr) return { err: 'não encontrei pensamentos nesse texto.' };
    var ok = [];
    arr.forEach(function (x) {
      if (!x || typeof x.t !== 'string' || !x.t.trim() || x.t.length > 20000) return;
      var ts = +x.ts;
      if (!isFinite(ts) || ts <= 0) return;
      var o = { t: x.t.trim(), ts: ts };
      var n = parseInt(x.n, 10); if (n > 0) o.n = n;
      var ed = +x.ed; if (isFinite(ed) && ed > 0) o.ed = ed;
      ok.push(o);
    });
    if (!ok.length) return { err: 'o backup está vazio ou fora do formato.' };
    ok.sort(function (a, b) { return a.ts - b.ts; });
    return { list: ok, skipped: arr.length - ok.length };
  }
  function persistChange(removed, added) {
    if (mode === 'cloud') {
      var p = Promise.resolve();
      removed.forEach(function (it) { p = p.then(function () { return drop(it); }); });
      added.forEach(function (it) { p = p.then(function () { return put(it); }); });
      return p;
    }
    if (!saveLocal()) fail();
    return Promise.resolve();
  }
  function restoreNow(text, replace) {
    var r = parseBackup(text);
    if (r.err) { say('err', r.err); return; }
    var added = [], removed = [], dup = 0, i;
    if (replace) {
      removed = items.slice();
      items = []; lastDeleted = null; wipe = false;
      var used = {};
      r.list.forEach(function (o, k) {
        var n = (o.n && !used[o.n]) ? o.n : 0;
        if (!n) { n = 1; while (used[n]) n++; }
        used[n] = 1;
        var it = { key: newKey() + k.toString(36), n: n, t: o.t, ts: o.ts };
        if (o.ed) it.ed = o.ed;
        items.push(it); added.push(it);
      });
    } else {
      var have = {};
      items.forEach(function (x) { have[x.ts + '|' + x.t] = 1; });
      r.list.forEach(function (o, k) {
        if (have[o.ts + '|' + o.t]) { dup++; return; }
        have[o.ts + '|' + o.t] = 1;
        var it = { key: newKey() + k.toString(36), n: nextN(), t: o.t, ts: o.ts };
        if (o.ed) it.ed = o.ed;
        items.push(it); added.push(it);
      });
    }
    sortItems();
    var msg = replace
      ? 'restaurado: ' + added.length + ' pensamentos no lugar dos anteriores.'
      : 'restaurado: ' + added.length + ' novos' + (dup ? ', ' + dup + ' já existiam' : '') + '.';

  }
  function cmdRestaurar() {
    var box = panelBox();

    var ta = document.createElement('textarea');
    ta.id = 'rst-text'; ta.placeholder = '{ "app": "emrys", ... }'; ta.setAttribute('aria-label', 'Texto do backup para restaurar');
    ta.setAttribute('autocapitalize', 'none'); ta.spellcheck = false;
    var file = document.createElement('input');
    file.type = 'file'; file.id = 'rst-file'; file.accept = '.json,application/json,text/plain';
    file.setAttribute('aria-label', 'Escolher arquivo de backup');
    file.addEventListener('change', function () {
      var f0 = file.files && file.files[0];

      var fr = new FileReader();
      fr.onload = function () { ta.value = String(fr.result || ''); say('dim', 'arquivo lido. escolha juntar ou substituir.'); };
      fr.onerror = function () { say('err', 'não consegui ler o arquivo.'); };
      fr.readAsText(f0);
    });
    var row = document.createElement('div'); row.className = 'ctl';
    var armed = false, timer = null;
    var rep = mkBtn('substituir tudo', function () {
      if (!ta.value.trim()) { say('err', 'cole o backup ou escolha um arquivo primeiro.'); return; }
      if (!armed) {
        armed = true; rep.textContent = 'confirmar: apaga os atuais';
        timer = setTimeout(function () { armed = false; rep.textContent = 'substituir tudo'; }, 5000);
        return;
      }
      clearTimeout(timer); armed = false; rep.textContent = 'substituir tudo';
      restoreNow(ta.value, true);
    });
    var mer = mkBtn('juntar com os atuais', function () {
      if (!ta.value.trim()) { say('err', 'cole o backup ou escolha um arquivo primeiro.'); return; }
      restoreNow(ta.value, false);
    });
    row.append(mer, rep);
    box.append(file, ta, row, mkNote('"juntar" mantém o que você já tem e não repete pensamentos iguais. "substituir" apaga os atuais antes.'));

  function cmdTags() {
    var count = {};

    var names = Object.keys(count).sort(function (a, b) { return count[b] - count[a] || (a < b ? -1 : 1); });
    if (!names.length) { say('dim', 'nenhuma tag ainda. escreva #palavra dentro de um pensamento para criar uma.'); return; }
    var wrap = ln('tagcloud');
    names.forEach(function (t) {

  function cmdRelembrar() {
    var pool = items.filter(function (x) { return Date.now() - x.ts > 20 * 3600e3; });

  function findN(s) {
    var n = +s;
    for (var i = 0; i < items.length; i++) if (items[i].n === n) return items[i];

  }
  function cmdEditar(arg) {
    var m = arg.match(/^#?(\d+)\s+([\s\S]+)$/);

    var it = findN(m[1]);

    it.t = m[2].trim(); it.ed = Date.now();

  function cmdApagar(arg) {
    var a = norm(arg.trim());
    if (a === 'tudo') {
      if (!items.length) { say('dim', 'não há nada para apagar.'); return; }
      wipe = true;
      say('err', 'isso apaga os ' + items.length + ' pensamentos. digite /confirmar para seguir. qualquer outra coisa cancela.');
      return;
    }
    var m = a.match(/^#?(\d+)$/);
    if (!m) { say('err', 'use: /apagar <nº> ou /apagar tudo'); return; }
    var it = findN(m[1]);
    if (!it) { say('err', 'não existe pensamento #' + m[1] + '.'); return; }
    items = items.filter(function (x) { return x !== it; });
    lastDeleted = it;
    drop(it);
    say('ok', 'apagado #' + it.n + '. /desfazer traz de volta.');
  }
  function cmdConfirmar() {
    if (!wipe) { say('dim', 'nada para confirmar.'); return; }
    wipe = false;
    var all = items.slice();
    items = []; lastDeleted = null;
    all.forEach(drop);
    say('ok', all.length + ' pensamentos apagados.');

  function cmdDesfazer() {
    if (!lastDeleted) { say('dim', 'nada para desfazer.'); return; }
    var it = lastDeleted; lastDeleted = null;
    items.push(it); sortItems(); put(it);
    say('ok', '#' + it.n + ' de volta.');
  }
  function cmdStats() {
    if (!items.length) { say('dim', 'sem números ainda. escreva o primeiro pensamento.'); return; }
    var words = items.reduce(function (s, x) { return s + x.t.trim().split(/\s+/).filter(Boolean).length; }, 0);
    var days = {};
    items.forEach(function (x) { days[dayKey(x.ts)] = 1; });
    var d = new Date();
    if (!days[dayKey(d.getTime())]) d.setDate(d.getDate() - 1);
    var streak = 0;
    while (days[dayKey(d.getTime())]) { streak++; d.setDate(d.getDate() - 1); }
    var nd = Object.keys(days).length;
    grid([
      ['pensamentos', String(items.length)],
      ['palavras', String(words)],
      ['dias com registro', String(nd)],
      ['sequência', streak + (streak === 1 ? ' dia' : ' dias')],
      ['primeiro', fmt(items[0].ts)],
      ['último', ago(items[items.length - 1].ts)]
    ], 'stat');
  }
  function cmdExportar() {

  function newKey() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
  function nextN() { return items.reduce(function (m, x) { return Math.max(m, x.n || 0); }, 0) + 1; }
  function saveThought(text) {
    var it = { key: newKey(), n: nextN(), t: text.trim(), ts: Date.now() };
    items.push(it);
    put(it);
    var tg = tagsOf(it.t);
    say('res', '↳ guardado como #' + it.n + ' · ' + fmt(it.ts) + (tg.length ? ' · ' + tg.map(function (x) { return '#' + x; }).join(' ') : ''));
  }
  function run(v) {
    hist.push(v); hi = hist.length;
    var e = ln('echo');
    var pr = document.createElement('span'); pr.className = 'p'; pr.textContent = 'mente:~$';
    e.append(pr, document.createTextNode(v));
    add(e);
    var isCmd = v.charAt(0) === '/' && v.charAt(1) !== '/';
    var name = '', arg = '';
    if (isCmd) {
      var m = v.slice(1).trim().match(/^(\S+)\s*([\s\S]*)$/);
      if (m) { name = norm(m[1]); arg = m[2]; }
    }
    if (wipe && name !== 'confirmar') { wipe = false; say('dim', 'apagar tudo cancelado.'); }
    if (!isCmd) { saveThought(v.charAt(0) === '/' ? v.slice(1) : v); return; }
    if (!name) { say('err', 'digite um comando depois da barra. /ajuda mostra a lista.'); return; }
    var c = null;
    for (var i = 0; i < CMDS.length; i++) {
      if (CMDS[i].n === name || CMDS[i].al.indexOf(name) !== -1) { c = CMDS[i]; break; }
    }
    if (!c) { say('err', 'comando desconhecido: /' + name + '. tente /ajuda.'); return; }
    c.run(arg);
  }

  function grow() {
    inp.style.height = 'auto';
    var h = inp.scrollHeight;
    inp.style.height = h ? Math.min(h, 160) + 'px' : '';
  }
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = inp.value.replace(/\s+$/, '');
    inp.value = ''; grow();
    if (v.trim()) run(v);
  });
  inp.addEventListener('input', grow);
  inp.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      f.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
      return;
    }
    var single = inp.value.indexOf('\n') === -1;
    if (e.key === 'ArrowUp' && single && (inp.value === '' || inp.selectionStart === 0) && hi > 0) {
      e.preventDefault(); hi--; inp.value = hist[hi]; grow();
    } else if (e.key === 'ArrowDown' && single && hi < hist.length && (inp.value === '' || inp.selectionStart === inp.value.length)) {
      e.preventDefault(); hi++; inp.value = hi < hist.length ? hist[hi] : ''; grow();
    } else if ((e.key === 'l' || e.key === 'L') && e.ctrlKey) {
      e.preventDefault(); cmdLimpar();
    }
  });

  function syncChips() {
    var all = document.querySelectorAll('.chip');
    for (var i = 0; i < all.length; i++) {
      var nodes = chipOut[all[i].dataset.cmd];
      all[i].setAttribute('aria-pressed', String(!!(nodes && nodes.length && nodes[0].isConnected)));
    }
  }
  document.querySelector('.chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b || inp.disabled) return;
    var cmd = b.dataset.cmd, prev = chipOut[cmd];
    if (prev && prev.length && prev[0].isConnected) {
      prev.forEach(function (n) { if (n.isConnected) n.remove(); });
      chipOut[cmd] = null;
      syncChips();
      return;
    }
    var before = Array.prototype.slice.call(out.children);
    run('/' + cmd);
    chipOut[cmd] = Array.prototype.slice.call(out.children).filter(function (n) { return before.indexOf(n) === -1; });
    syncChips();
  });

    '⣿⣿⠇⠼⠃⣸⠟⠀⣷⠐⠄⡙⠛⠠⢙⣡⣤⣙⣛⣥⣌⡋⠄⠙⢛⠡⠂⣼⡀⠹⣇⠘⠧⠸⣿⣿⣿',
    '⣿⣿⣠⠆⢰⡟⢰⠈⢿⣷⣦⣤⣴⣶⣿⣿⡿⠇⠘⢿⣿⣿⣷⣦⣤⣴⣾⣿⠃⣆⢻⣇⠐⣄⣿⣿⣿',
    '⣿⣿⡟⠀⡿⢡⣿⣆⠈⠛⠿⠿⠿⠟⠛⣉⣤⣶⣶⣦⣉⠛⠻⠿⠿⠿⠛⠁⣰⣿⡌⢻⠀⢹⣿⣿⣿',
    '⣿⣿⣇⠀⠀⣾⢛⣿⠀⢳⣶⣦⠸⠿⠋⣉⣤⣴⣦⣤⣉⠙⠻⠇⣴⣶⣾⠀⣿⡟⣷⠀⣀⣼⣿⣿⣿',
    '⣿⣿⣿⣿⠰⠃⣾⡟⣇⠸⣿⣿⣧⣴⣾⣿⣿⣿⣿⣿⣿⣷⣦⣴⣿⣿⠇⣰⠻⣷⠘⠂⣿⣿⣿⣿⣿',
    '⣿⣿⣿⣿⡀⡀⢿⠀⢸⠀⠙⠀⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⡇⠋⠀⡟⠀⠻⢠⠀⣿⣿⣿⣿⣿',
    '⣿⣿⣿⣿⣿⣿⡀⢰⡀⠀⡆⡀⠛⢻⣿⣿⣿⣿⣿⣿⣿⣿⡟⠋⠀⢠⡀⢀⣆⠀⣾⣿⣿⣿⣿⣿⣿',
    '⣿⣿⣿⣿⣿⣿⣾⣿⣷⣿⣧⡀⠈⠋⢸⣿⣿⣿⣿⡏⠙⠃⣄⣼⣿⣿⣿⣿⣾⣿⣿⣿⣿⣿⣿⣿⣿',
    '⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣇⢠⠀⠻⣿⣿⡟⠀⡀⣰⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿',
    '⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣷⣄⠉⠋⣠⣾⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿',
    '⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣷⣾⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿⣿'
  ];
  function drawArt(el) { el.textContent = ART.join('\n'); }
  drawArt($('g-art'));
  var term = document.querySelector('.term');
  var gate = $('gate'), gUser = $('g-user'), gPass = $('g-pass'), gKeep = $('g-keep'), gGo = $('g-go'), gMsg = $('g-msg');
  var AUTH = 'be456ad2f02076084535ca52d99a17fb78646e1bb0de2bf278cbb51f3a0715d9';
  var AUTH_KEY = 'pensamentos.auth.v1', PW_KEY = 'pensamentos.pw.v1', fails = 0;
  var CODE_SALT = 'pensamentos-recuperacao-v1';
  var CODE_HASH = 'e0e3c7650941cc382c159467c6ff38df1e4dd89a5e831ba309346ad9eab34423';
  var KDF_ITER = 150000;

  function getOverride() {
    try {
      var o = JSON.parse(localStorage.getItem(PW_KEY));
      if (o && typeof o.hash === 'string' && typeof o.salt === 'string') return o;
    } catch (e) {}
    return null;
  }
  function authToken() { var o = getOverride(); return 'ok:' + (o ? o.hash : AUTH); }
  function hex(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  function kdf(secret, salt) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey('raw', enc.encode(secret), 'PBKDF2', false, ['deriveBits']).then(function (k) {
      return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt), iterations: KDF_ITER }, k, 256);
    }).then(hex);
  }
  function verifyLogin(u, p) {
    var o = getOverride();
    if (o) return kdf(u + '|' + p, o.salt).then(function (h) { return h === o.hash; });
    return sha('pensamentos|' + u + '|' + p).then(function (h) { return h === AUTH; });
  }
  function verifyCode(c) {
    var norm1 = String(c).trim().replace(/^:+/, '').trim().toLowerCase();
    return kdf(norm1, CODE_SALT).then(function (h) { return h === CODE_HASH; });
  }
  function setPassword(np) {
    var hadLocal = false;
    try { hadLocal = !!localStorage.getItem(AUTH_KEY); } catch (e) {}
    var salt = hex(crypto.getRandomValues(new Uint8Array(16)));
    return kdf('cant|' + np, salt).then(function (h) {
      try { localStorage.setItem(PW_KEY, JSON.stringify({ salt: salt, hash: h })); } catch (e) { throw new Error('storage'); }
      try { sessionStorage.setItem(AUTH_KEY, authToken()); } catch (e) {}
      if (hadLocal) { try { localStorage.setItem(AUTH_KEY, authToken()); } catch (e) {} }
    });
  }
  function pwRule(a, b) {
    if (a.length < 8) return 'a senha precisa de pelo menos 8 caracteres.';
    if (a !== b) return 'as duas senhas não são iguais.';
    return '';
  }

  function stored() {
    try { if (sessionStorage.getItem(AUTH_KEY) === authToken()) return true; } catch (e) {}
    try { if (localStorage.getItem(AUTH_KEY) === authToken()) return true; } catch (e) {}
    return false;
  }
  function sha(s) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) { return b.toString(16).padStart(2, '0'); }).join('');
    });
  }
  function cmdSair() {
    try { sessionStorage.removeItem(AUTH_KEY); } catch (e) {}
    try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
    say('ok', 'trancado. até logo.');
    setTimeout(function () { try { location.reload(); } catch (e) {} }, 400);
  }

  function boot() {
    inp.disabled = true;
    say('dim', 'iniciando…');
    initStore().then(function () {
      out.textContent = '';
      modeEl.textContent = mode === 'cloud' ? 'cofre privado' : 'neste aparelho';
      welcome();
      inp.disabled = false;
      if (window.matchMedia('(pointer: fine)').matches) { try { inp.focus({ preventScroll: true }); } catch (e) {} }
    });
  }
  function enter(keep) {
    try { sessionStorage.setItem(AUTH_KEY, authToken()); } catch (e) {}
    if (keep) { try { localStorage.setItem(AUTH_KEY, authToken()); } catch (e) {} }
    gate.hidden = true;
    term.hidden = false;
    lastAct = Date.now();
    grow();
    boot();
  }

  gate.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!(window.crypto && crypto.subtle)) { gMsg.textContent = 'este navegador não consegue verificar a senha aqui.'; return; }
    var u = gUser.value.trim().toLowerCase(), p = gPass.value;
    gGo.disabled = true;
    verifyLogin(u, p).then(function (okLogin) {
      if (okLogin) { gMsg.textContent = ''; gPass.value = ''; enter(gKeep.checked); return; }
      fails++;
      gPass.value = '';
      gMsg.textContent = 'login ou senha incorretos.';
      setTimeout(function () { gGo.disabled = false; gPass.focus(); }, Math.min(fails, 8) * 800);
    }).catch(function () {
      gMsg.textContent = 'não consegui verificar. tente de novo.';
      gGo.disabled = false;
    });
  });


  /* ---------- trancar sozinho ---------- */
  var lastAct = Date.now(), hiddenAt = 0;
  function lockMs() { return cfg.lock > 0 ? cfg.lock * 60000 : 0; }
  function touch() { lastAct = Date.now(); }
  ['pointerdown', 'keydown', 'touchstart', 'scroll', 'input'].forEach(function (ev) {
    document.addEventListener(ev, touch, { passive: true, capture: true });
  });
  function lockNow() {
    try { sessionStorage.removeItem(AUTH_KEY); } catch (e) {}
    try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
    term.hidden = true; gate.hidden = false;
    out.textContent = ''; inp.value = '';
    try { location.reload(); } catch (e) {}
  }
  setInterval(function () {
    var lim = lockMs();
    if (!term.hidden && lim && Date.now() - lastAct > lim) lockNow();
  }, 10000);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    var lim = lockMs();
    if (!term.hidden && lim && hiddenAt && Date.now() - hiddenAt > lim) { hiddenAt = 0; lockNow(); return; }
    hiddenAt = 0; lastAct = Date.now();
  });

  /* ---------- recuperar acesso (tela de login) ---------- */
  var rec = $('rec'), rCode = $('r-code'), rNew = $('r-new'), rNew2 = $('r-new2'), rGo = $('r-go'), rMsg = $('r-msg');
  function showRec(on) {
    rec.hidden = !on; gate.hidden = on;
    rMsg.textContent = '';
    try { (on ? rCode : gUser).focus(); } catch (e) {}
  }
  $('g-forgot').addEventListener('click', function () { showRec(true); });
  $('r-back').addEventListener('click', function () { showRec(false); });
  rec.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!(window.crypto && crypto.subtle)) { rMsg.textContent = 'este navegador não consegue verificar aqui.'; return; }
    var bad = pwRule(rNew.value, rNew2.value);
    if (bad) { rMsg.textContent = bad; return; }
    rGo.disabled = true;
    verifyCode(rCode.value).then(function (ok) {
      if (!ok) {
        fails++; rCode.value = '';
        rMsg.textContent = 'código incorreto.';
        setTimeout(function () { rGo.disabled = false; rCode.focus(); }, Math.min(fails, 8) * 800);
        return;
      }
      return setPassword(rNew.value).then(function () {
        try { sessionStorage.removeItem(AUTH_KEY); } catch (e) {}
        try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
        rCode.value = ''; rNew.value = ''; rNew2.value = ''; rGo.disabled = false;
        showRec(false);
        gMsg.textContent = 'senha trocada. entre com a nova.';
      });
    }).catch(function () {
      rMsg.textContent = 'não consegui salvar a senha neste navegador.';
      rGo.disabled = false;
    });
  });

  function cmdTrocarSenha() {
    var box = panelBox();
    box.appendChild(mkNote('a nova senha vale só neste aparelho. nos outros, continua a senha antiga. o código de recuperação é obrigatório.'));
    function fld(id, label, type) {
      var wrap = document.createElement('div'); wrap.className = 'row';
      var l = document.createElement('label'); l.className = 'lab'; l.htmlFor = id; l.textContent = label;
      var i = document.createElement('input'); i.id = id; i.type = type;
      i.autocomplete = type === 'password' ? 'new-password' : 'off';
      i.setAttribute('autocapitalize', 'none'); i.spellcheck = false;
      i.style.cssText = 'font:inherit;font-size:max(16px,1em);color:var(--fg);background:transparent;border:1px solid var(--line);padding:0.3rem 1ch;min-width:0;width:100%;box-sizing:border-box;';
      wrap.append(l, i);
      box.appendChild(wrap);
      return i;
    }
    var fc = fld('tp-code', 'código', 'text');
    var f1 = fld('tp-new', 'nova', 'password');
    var f2 = fld('tp-new2', 'repetir', 'password');
    var row = document.createElement('div'); row.className = 'ctl';
    var busy = false;
    row.appendChild(mkBtn('trocar senha', function () {
      if (busy) return;
      if (!(window.crypto && crypto.subtle)) { say('err', 'este navegador não consegue verificar a senha aqui.'); return; }
      var bad = pwRule(f1.value, f2.value);
      if (!fc.value.trim()) bad = 'digite o código de recuperação.';
      if (bad) { say('err', bad); return; }
      busy = true;
      verifyCode(fc.value).then(function (ok) {
        if (!ok) { say('err', 'código incorreto. nada foi alterado.'); return; }
        return setPassword(f1.value).then(function () {
          box.remove();
          say('ok', 'senha trocada neste aparelho.');
        });
      }).catch(function () { say('err', 'não consegui salvar a nova senha neste navegador.'); })
        .then(function () { busy = false; });
    }));
    box.appendChild(row);
    add(box);
    try { fc.focus(); } catch (e) {}
  }

  if (stored()) enter(false);
  else { try { gUser.focus(); } catch (e) {} }
})();
</script>
